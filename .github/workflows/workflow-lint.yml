name: Workflow Lint
on: [push, pull_request]
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.12 --repo rhysd/actionlint --pattern actionlint_1.7.12_linux_amd64.tar.gz --dir /tmp
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint_1.7.12_linux_amd64.tar.gz' | sha256sum -c -
          tar -xzf /tmp/actionlint_1.7.12_linux_amd64.tar.gz -C /tmp actionlint
          /tmp/actionlint
