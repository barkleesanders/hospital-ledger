<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background: solid near-black zinc-950 -->
  <rect width="1200" height="630" fill="#0a0a0b"/>

  <!-- Subtle top-right corner accent: tiny emerald dot, like a print mark -->
  <circle cx="1140" cy="60" r="3" fill="#6ee7b7"/>

  <!-- Eyebrow: HOSPITAL LEDGER, top-left, emerald-300, wide tracking -->
  <text x="80" y="86"
    font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="14" font-weight="500"
    letter-spacing="4"
    fill="#6ee7b7">HOSPITAL LEDGER</text>

  <!-- Thin horizontal rule under eyebrow -->
  <line x1="80" y1="106" x2="320" y2="106" stroke="#27272a" stroke-width="1"/>

  <!-- Headline: massive italic display serif, two lines -->
  <text x="80" y="248"
    font-family="'Instrument Serif', Georgia, 'Times New Roman', serif"
    font-style="italic" font-weight="400"
    font-size="80"
    letter-spacing="-1.5"
    fill="#fafafa">What every U.S. hospital</text>
  <text x="80" y="338"
    font-family="'Instrument Serif', Georgia, 'Times New Roman', serif"
    font-style="italic" font-weight="400"
    font-size="80"
    letter-spacing="-1.5"
    fill="#fafafa"><tspan fill="#6ee7b7">actually</tspan><tspan fill="#fafafa" dx="20">charges.</tspan></text>

  <!-- Range-bar block label -->
  <text x="80" y="396"
    font-family="'JetBrains Mono', ui-monospace, monospace"
    font-size="12" font-weight="500"
    letter-spacing="2"
    fill="#a1a1aa">TOTAL HIP REPLACEMENT &#8226; CPT 27130</text>

  <!-- Range bar: thin zinc-700 line spanning ~880px -->
  <line x1="120" y1="478" x2="1080" y2="478" stroke="#3f3f46" stroke-width="2"/>

  <!-- Three dots on the line -->
  <!-- Left dot: amber, $3,124 -->
  <circle cx="120" cy="478" r="10" fill="#fcd34d"/>
  <text x="120" y="516"
    font-family="'JetBrains Mono', ui-monospace, monospace"
    font-size="20" font-weight="600"
    text-anchor="middle"
    fill="#fcd34d">$3,124</text>
  <text x="120" y="538"
    font-family="'JetBrains Mono', ui-monospace, monospace"
    font-size="11" font-weight="400"
    text-anchor="middle"
    letter-spacing="1.5"
    fill="#71717a">CHEAPEST</text>

  <!-- Center dot: emerald, $28,901 median -->
  <!-- Position proportional: median is at frac 0.145 of (max-min) -->
  <circle cx="259" cy="478" r="12" fill="#6ee7b7"/>
  <text x="259" y="450"
    font-family="'JetBrains Mono', ui-monospace, monospace"
    font-size="20" font-weight="600"
    text-anchor="middle"
    fill="#6ee7b7">$28,901</text>
  <text x="259" y="430"
    font-family="'JetBrains Mono', ui-monospace, monospace"
    font-size="11" font-weight="400"
    text-anchor="middle"
    letter-spacing="1.5"
    fill="#a1a1aa">MEDIAN</text>

  <!-- Right dot: rose, $182,439 -->
  <circle cx="1080" cy="478" r="10" fill="#fda4af"/>
  <text x="1080" y="516"
    font-family="'JetBrains Mono', ui-monospace, monospace"
    font-size="20" font-weight="600"
    text-anchor="middle"
    fill="#fda4af">$182,439</text>
  <text x="1080" y="538"
    font-family="'JetBrains Mono', ui-monospace, monospace"
    font-size="11" font-weight="400"
    text-anchor="middle"
    letter-spacing="1.5"
    fill="#71717a">MOST EXPENSIVE</text>

  <!-- Footer: thin top rule -->
  <line x1="80" y1="582" x2="1120" y2="582" stroke="#27272a" stroke-width="1"/>

  <!-- Bottom-left: hospitalledger.com -->
  <text x="80" y="608"
    font-family="'JetBrains Mono', ui-monospace, monospace"
    font-size="18" font-weight="500"
    fill="#71717a">hospitalledger.com</text>

  <!-- Bottom-right: free · public · CC0 -->
  <text x="1120" y="608"
    font-family="'JetBrains Mono', ui-monospace, monospace"
    font-size="18" font-weight="500"
    text-anchor="end"
    fill="#71717a">free &#183; public &#183; CC0</text>
</svg>
